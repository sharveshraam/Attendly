<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Offline · Attendly</title>
  <style>
    :root { color-scheme: light; --bg:#f6f7fb; --card:#fff; --text:#172033; --muted:#69758d; --line:#e3e7f0; --accent:#6d5ce7; }
    @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#0b1020; --card:#141b2d; --text:#f4f5fa; --muted:#9aa5bd; --line:#26314c; --accent:#8b7cff; } }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:14px/1.6 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .card { max-width:430px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px; box-shadow:0 18px 50px rgba(0,0,0,.09); text-align:center; }
    .mark { width:52px; height:52px; border-radius:15px; background:var(--accent); color:#fff; display:grid; place-items:center; margin:0 auto 18px; font-size:24px; font-weight:800; }
    h1 { margin:0 0 8px; font-size:22px; letter-spacing:-.03em; }
    p { color:var(--muted); margin:0 0 20px; font-size:13px; }
    button { border:0; border-radius:10px; padding:11px 18px; background:var(--accent); color:#fff; font-weight:650; cursor:pointer; }
    small { display:block; margin-top:18px; color:var(--muted); font-size:11px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">A</div>
    <h1>You&rsquo;re offline</h1>
    <p>Attendly couldn&rsquo;t reach the network. Your scheduled classes, courses and attendance marks are stored locally on this device and will sync automatically when you reconnect. Nothing has been lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>Private data is never written to the shared app cache.</small>
  </main>
</body>
</html>
