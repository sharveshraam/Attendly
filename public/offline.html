<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#090D14" />
  <title>Offline · Attendly</title>
  <style>
    :root { color-scheme: dark; --bg:#090D14; --card:#101722; --elevated:#182231; --text:#F1F5F9; --muted:#A5ADBA; --faint:#6E7889; --line:#263244; --accent:#38B8A5; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text); font:14px/1.6 "Inter Variable",Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
    .card { max-width:430px; width:100%; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px; box-shadow:0 18px 50px rgba(0,0,0,.35); text-align:center; }
    .mark { width:52px; height:52px; border-radius:15px; background:var(--accent); color:#090D14; display:grid; place-items:center; margin:0 auto 18px; }
    h1 { margin:0 0 8px; font-size:22px; letter-spacing:-.04em; font-weight:650; }
    p { color:var(--muted); margin:0 0 20px; font-size:13px; }
    button { border:0; border-radius:10px; padding:11px 18px; background:var(--accent); color:#090D14; font-weight:700; cursor:pointer; }
    small { display:block; margin-top:18px; color:var(--faint); font-size:11px; }
    .glyph { width:26px; height:26px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">
      <svg class="glyph" viewBox="0 0 32 32" fill="none" stroke="#090D14" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="6" width="26" height="23" rx="4"/>
        <path d="M3 12 H29 M9 3 V8 M23 3 V8"/>
        <path d="M10 20 L14 24 L22 16"/>
      </svg>
    </div>
    <h1>You&rsquo;re offline</h1>
    <p>Attendly couldn&rsquo;t reach the network. Your scheduled classes, courses and attendance marks are stored locally on this device and will sync automatically when you reconnect. Nothing has been lost.</p>
    <button type="button" onclick="location.reload()">Try again</button>
    <small>Private data is never written to the shared app cache.</small>
  </main>
</body>
</html>
